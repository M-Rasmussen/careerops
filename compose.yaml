name: careerops

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      # Named volume: survives `docker compose stop`, `down`, rebuilds, and reboots.
      - pgdata:/var/lib/postgresql/data
    # Not published to the host; use `docker compose exec db psql ...` for access.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      TEST_POSTGRES_DB: ${TEST_POSTGRES_DB:-careerops_test}
      # Optional AI provider (Phase 4A). Unset = AI disabled; the tracker still works. Server-side only.
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-2000}
      AI_TOKEN_PARAM: ${AI_TOKEN_PARAM:-max_tokens}
      AI_MAX_STEPS: ${AI_MAX_STEPS:-6}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-60}
      AI_MAX_RUNS_PER_DAY: ${AI_MAX_RUNS_PER_DAY:-20}
      # Job discovery (Phase 4B). JSearch is off unless explicitly enabled with a key. Server-side only.
      DISCOVERY_HIMALAYAS_ENABLED: ${DISCOVERY_HIMALAYAS_ENABLED:-false}
      DISCOVERY_HIMALAYAS_MAX_PAGES: ${DISCOVERY_HIMALAYAS_MAX_PAGES:-1}
      DISCOVERY_WORKER_ENABLED: ${DISCOVERY_WORKER_ENABLED:-true}
      DISCOVERY_AUTO_SYNC_ENABLED: ${DISCOVERY_AUTO_SYNC_ENABLED:-true}
      DISCOVERY_SYNC_INTERVAL_HOURS: ${DISCOVERY_SYNC_INTERVAL_HOURS:-24}
      DISCOVERY_SYNC_CONCURRENCY: ${DISCOVERY_SYNC_CONCURRENCY:-2}
      DISCOVERY_MIN_RESYNC_MINUTES: ${DISCOVERY_MIN_RESYNC_MINUTES:-60}
      DISCOVERY_MAX_VERIFICATIONS_PER_RUN: ${DISCOVERY_MAX_VERIFICATIONS_PER_RUN:-5}
      JSEARCH_ENABLED: ${JSEARCH_ENABLED:-false}
      JSEARCH_API_KEY: ${JSEARCH_API_KEY:-}
      JSEARCH_MONTHLY_REQUEST_LIMIT: ${JSEARCH_MONTHLY_REQUEST_LIMIT:-100}
      JSEARCH_MAX_REQUESTS_PER_RUN: ${JSEARCH_MAX_REQUESTS_PER_RUN:-5}
      JSEARCH_CACHE_HOURS: ${JSEARCH_CACHE_HOURS:-24}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build: ./frontend
    restart: unless-stopped
    environment:
      # vite preview proxies /api here; the browser only ever talks to the web origin.
      API_PROXY_TARGET: http://api:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Optional local LLM for AI matching. Off by default; start with: docker compose --profile local-ai up -d
  # The API reaches it at http://ollama:11434/v1 on the Compose network; no host port is published.
  ollama:
    image: ollama/ollama:0.40.16
    profiles: ["local-ai"]
    restart: unless-stopped
    environment:
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_NUM_PARALLEL: "1"  # one request at a time keeps CPU memory use predictable
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
    name: careerops_pgdata
  ollama_models:
    name: careerops_ollama
